name: Daily S&P 500 Text Update (Free)

on:
  schedule:
    # Cron is in UTC. 21:30 UTC = 4:30pm US Eastern during Daylight Time
    # (EDT), 5:30pm during Standard Time (EST). Runs Mon-Fri only.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Run S&P 500 text script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CARRIER_GATEWAY: ${{ secrets.CARRIER_GATEWAY }}
        run: python3 sp500_email_sms.py
